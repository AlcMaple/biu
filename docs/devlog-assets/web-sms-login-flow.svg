<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">网页 B 站扫码与手机号验证码登录流程</title>
  <desc id="desc">用户在网页登录弹窗选择扫码或手机号验证码。两条路径都由同源服务保存 B 站凭据，身份校验成功后才向浏览器设置本站 HttpOnly 会话。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#5e6c78"/>
    </marker>
    <style>
      .title { fill:#282529; font:700 19px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .subtitle { fill:#756f73; font:12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .section { fill:#4a4450; font:700 14px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .card-title { fill:#282529; font:700 12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .body { fill:#4a4450; font:11px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .small { fill:#756f73; font:10.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .green-title { fill:#316247; font:700 12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .blue-title { fill:#36566d; font:700 12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .yellow-title { fill:#7a6234; font:700 12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .red-title { fill:#96434f; font:700 12.5px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .arrow { stroke:#5e6c78; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#9b949d; stroke-width:1.3; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="868" rx="14" fill="#fbfafb" stroke="#e2dcdf"/>
  <text x="38" y="43" class="title">网页 B 站登录：两种入口，一条安全会话边界</text>
  <text x="38" y="66" class="subtitle">结果：扫码与手机号验证码都可登录；浏览器始终不接触 B 站 Cookie 或刷新凭据。</text>

  <rect x="34" y="92" width="1132" height="188" rx="10" fill="#f4f2f5" stroke="#c3bcc6"/>
  <text x="56" y="119" class="section">用户看到的登录弹窗</text>
  <rect x="56" y="138" width="510" height="118" rx="9" fill="#ffffff" stroke="#c3bcc6"/>
  <rect x="74" y="154" width="126" height="30" rx="7" fill="#edf7f1" stroke="#7fad91"/>
  <text x="105" y="174" class="green-title">扫码登录</text>
  <rect x="208" y="154" width="166" height="30" rx="7" fill="#eef4f8" stroke="#91adc1"/>
  <text x="231" y="174" class="blue-title">手机号验证码登录</text>
  <text x="75" y="209" class="card-title">用户按习惯选择一种方式</text>
  <text x="75" y="231" class="body">扫码：用 B 站手机客户端确认</text>
  <text x="294" y="221" class="body">短信：填写手机号、</text>
  <text x="294" y="241" class="body">通过人机校验、输入验证码</text>

  <rect x="593" y="138" width="551" height="118" rx="9" fill="#fff8e8" stroke="#d9bd85"/>
  <text x="615" y="166" class="yellow-title">浏览器只保存本站登录标识</text>
  <text x="615" y="190" class="body">可见：二维码地址 / 一次性登录编号 / 人机校验公开参数</text>
  <text x="615" y="213" class="body">不可见：B 站 Cookie、短信登录票据、刷新凭据</text>
  <text x="615" y="237" class="small">本站会话以 HttpOnly Cookie 保存，脚本不能读取。</text>

  <path d="M310 280 L310 324" class="arrow"/>
  <path d="M869 280 L869 324" class="arrow"/>

  <text x="56" y="328" class="section">同源服务在后台完成的事情</text>
  <rect x="56" y="347" width="520" height="282" rx="10" fill="#eef4f8" stroke="#91adc1"/>
  <text x="79" y="376" class="blue-title">路径一：扫码登录</text>
  <rect x="79" y="397" width="196" height="86" rx="9" fill="#ffffff" stroke="#91adc1"/>
  <text x="97" y="424" class="card-title">创建短时扫码事务</text>
  <text x="97" y="447" class="body">登录编号与当前浏览器绑定</text>
  <text x="97" y="467" class="small">二维码内容留在服务端事务中</text>
  <path d="M276 440 L340 440" class="arrow"/>
  <rect x="343" y="397" width="205" height="86" rx="9" fill="#ffffff" stroke="#91adc1"/>
  <text x="360" y="424" class="card-title">等待 B 站扫码确认</text>
  <text x="360" y="447" class="body">只对“待扫码 / 待确认”继续查询</text>
  <text x="360" y="467" class="small">过期、风控、限流立即停止</text>
  <path d="M311 484 L311 543" class="arrow"/>
  <rect x="147" y="546" width="330" height="58" rx="9" fill="#edf7f1" stroke="#7fad91"/>
  <text x="171" y="572" class="green-title">取得可续期凭据后，进入统一身份校验</text>
  <text x="171" y="592" class="small">未通过校验不会替换已有登录状态。</text>

  <rect x="600" y="347" width="544" height="282" rx="10" fill="#eef4f8" stroke="#91adc1"/>
  <text x="623" y="376" class="blue-title">路径二：手机号验证码登录</text>
  <rect x="623" y="397" width="155" height="105" rx="9" fill="#ffffff" stroke="#91adc1"/>
  <text x="641" y="424" class="card-title">获取人机校验参数</text>
  <text x="641" y="447" class="body">用户手动完成验证</text>
  <text x="641" y="469" class="small">不自动绕过或代答</text>
  <text x="641" y="488" class="small">验证码挑战</text>
  <path d="M779 450 L834 450" class="arrow"/>
  <rect x="837" y="397" width="278" height="121" rx="9" fill="#ffffff" stroke="#91adc1"/>
  <text x="855" y="424" class="card-title">发送短信并保留短时登录事务</text>
  <text x="855" y="447" class="body">服务端保存：短信票据与预登录 Cookie</text>
  <text x="855" y="466" class="body">以及号码；均不回传浏览器</text>
  <text x="855" y="487" class="small">浏览器只持有不可猜的一次性登录编号</text>
  <text x="855" y="505" class="small">号码限流，事务与当前浏览器绑定</text>
  <path d="M968 519 L968 543" class="arrow"/>
  <rect x="721" y="546" width="330" height="58" rx="9" fill="#edf7f1" stroke="#7fad91"/>
  <text x="744" y="572" class="green-title">提交短信验证码，进入统一身份校验</text>
  <text x="744" y="592" class="small">成功兑换后事务立即作废，避免重复提交。</text>

  <path d="M312 630 L312 692 L571 692" class="arrow"/>
  <path d="M886 630 L886 692 L628 692" class="arrow"/>
  <rect x="439" y="667" width="322" height="81" rx="10" fill="#edf7f1" stroke="#7fad91"/>
  <text x="467" y="697" class="green-title">统一收口：验证 B 站身份</text>
  <text x="467" y="720" class="body">确认账号、必要 Cookie 与可续期凭据齐全后，</text>
  <text x="467" y="739" class="body">才替换为本站 HttpOnly 登录会话。</text>

  <path d="M600 748 L600 785" class="arrow"/>
  <rect x="339" y="790" width="522" height="67" rx="9" fill="#edf7f1" stroke="#7fad91"/>
  <text x="365" y="813" class="green-title">最终体验：同一网页账号状态可用于收藏、播放与需要登录的 B 站功能</text>
  <text x="365" y="832" class="small">服务重启、事务过期、跨浏览器使用或触发限流时，提示重新开始。</text>
  <text x="365" y="848" class="small">敏感 B 站凭据不写入浏览器或持久化存储。</text>

  <rect x="922" y="666" width="222" height="100" rx="9" fill="#fdeef0" stroke="#d99aa5"/>
  <text x="943" y="695" class="red-title">不会发生的事</text>
  <text x="943" y="718" class="body">浏览器直连 B 站登录接口</text>
  <text x="943" y="737" class="body">或把 Cookie / 刷新凭据</text>
  <text x="943" y="755" class="body">写入网页存储</text>
</svg>
