<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#282529}.title{font-size:19px;font-weight:700}.sub{font-size:12.5px;fill:#756f73}.h{font-size:14px;font-weight:700}.b{font-size:12.5px;font-weight:700}.p{font-size:11px}</style><rect x="1" y="1" width="878" height="568" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text x="26" y="37" class="title">后台落盘执行器：结果未知就停手（待接线）</text><text x="26" y="62" class="sub">本阶段完成独立执行器与故障验证，现有播放入口尚未切换，线上体验未改变。</text><text x="26" y="100" class="h">正常请求：保留确认顺序，不用关闭保护换速度</text><rect x="26" y="116" width="250" height="140" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="40" y="142" class="b">网页主线程</text><text x="40" y="166" class="p">向后台申请出站许可</text><text x="40" y="188" class="p">等待期间仍可处理其他事件</text><text x="40" y="222" class="p">尚未接入：取址与媒体入口</text><rect x="315" y="116" width="250" height="140" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="329" y="142" class="b">独立后台线程</text><text x="329" y="166" class="p">串行执行原有严格落盘事务</text><text x="329" y="188" class="p">文件与目录都确认后才回许可</text><text x="329" y="222" class="p">不省略持久化，不自动抢锁</text><rect x="604" y="116" width="250" height="140" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="618" y="142" class="b">返回主线程后再核对</text><text x="618" y="166" class="p">等待时已经发现上游限制？</text><text x="618" y="188" class="p">旧许可作废，保留未确认意图</text><text x="618" y="222" class="p">旧许可不代表现在还能出站</text><path d="M280 181H309M598 181H571" stroke="#91adc1" fill="none"/><text x="26" y="294" class="h">故障与关闭：不把超时当成功，不用重启探测上游</text><rect x="26" y="312" width="397" height="145" rx="10" fill="#fdeef0" stroke="#d99aa5"/><text x="40" y="339" class="b">线程卡住、退出或返回异常消息</text><text x="40" y="363" class="p">拒绝等待中的操作，停止该执行器</text><text x="40" y="385" class="p">已写意图与锁仍保留，不自动重试或清理</text><text x="40" y="421" class="p">显式关闭同样拒绝后续入场</text><rect x="457" y="312" width="397" height="145" rx="10" fill="#f4f2f5" stroke="#c3bcc6"/><text x="471" y="339" class="b">为什么不直接换后台线程再试？</text><text x="471" y="363" class="p">前一次可能已经写盘或出站，结果仍未知</text><text x="471" y="385" class="p">应先检查记录，按当前版本明确恢复</text><text x="471" y="421" class="p">独立线程不等于支持多个服务共享活跃请求</text><text x="26" y="497" class="h">常见情况与尚未完成</text><text x="26" y="522" class="p">正常响应不触发暂停；真正切换入口前，还要验证取消、响应早断、开发打包及服务停机链路。</text><text x="26" y="546" class="sub">真实慢盘、断电和平台兼容仍待验收；图稿随 Draft PR 待审，不代表已发布。</text></svg>