<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#91adc1"/></marker></defs><rect x="1" y="1" width="998" height="623" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="28" y="38" font-size="19" font-weight="700" fill="#282529">本地收藏备份与新会话恢复 · 提案待审</text><text x="28" y="62" font-size="12.5" fill="#756f73">结论：先补齐备份 → 空会话恢复 → 找回播放；本图是流程设计，功能尚未实现。</text><text x="28" y="91" font-size="14" font-weight="700" fill="#282529">用户会经历什么</text><rect x="28" y="106" width="286" height="155" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="131" font-size="12.5" font-weight="700" fill="#36566d">原会话：留下可恢复副本</text><text x="42" y="159" font-size="11" fill="#36566d">从设置找到「备份本地收藏」</text><text x="42" y="182" font-size="11" fill="#36566d">只读取已完整加载的收藏和标签</text><text x="42" y="205" font-size="11" fill="#36566d">下载结果不包含登录态与凭据</text><text x="42" y="228" font-size="11" fill="#36566d">原内容不因备份而改变</text><rect x="357" y="106" width="286" height="155" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="371" y="131" font-size="12.5" font-weight="700" fill="#7a6234">新会话：先预览，再恢复</text><text x="371" y="159" font-size="11" fill="#7a6234">导入预览列出歌单、歌曲和标签</text><text x="371" y="182" font-size="11" fill="#7a6234">首版只接受没有本地内容的目标</text><text x="371" y="205" font-size="11" fill="#7a6234">有原数据时终止，不覆盖</text><text x="371" y="228" font-size="11" fill="#7a6234">取消或文件无效时不写入</text><rect x="686" y="106" width="286" height="155" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="700" y="131" font-size="12.5" font-weight="700" fill="#316247">恢复后：找回歌曲，再继续听</text><text x="700" y="159" font-size="11" fill="#316247">从同一套歌单页面找回内容</text><text x="700" y="182" font-size="11" fill="#316247">刷新后仍能找到并播放</text><text x="700" y="205" font-size="11" fill="#316247">恢复成功不等于音质已验收</text><text x="700" y="228" font-size="11" fill="#316247">真实上游与硬件另行验证</text><path d="M320 181H349" stroke="#91adc1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M649 181H678" stroke="#91adc1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="28" y="298" font-size="14" font-weight="700" fill="#282529">数据边界与失败处理</text><rect x="28" y="314" width="286" height="183" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="339" font-size="12.5" font-weight="700" fill="#36566d">三个不同概念，要分清</text><text x="42" y="367" font-size="11" fill="#36566d">设置导出：只含界面等配置</text><text x="42" y="390" font-size="11" fill="#36566d">桌面目录副本：现有手工方式</text><text x="42" y="413" font-size="11" fill="#36566d">同步前副本：内部故障保护</text><text x="42" y="436" font-size="11" fill="#36566d">以上都不是已完成的一站式恢复</text><text x="42" y="459" font-size="11" fill="#36566d">本提案不改变现有持久化格式</text><rect x="357" y="314" width="286" height="183" rx="10" fill="#fdeef0" stroke="#d99aa5"/><text x="371" y="339" font-size="12.5" font-weight="700" fill="#96434f">为什么不直接覆盖旧文件</text><text x="371" y="367" font-size="11" fill="#96434f">文件版本、引用关系先校验</text><text x="371" y="390" font-size="11" fill="#96434f">损坏或不支持内容应明确终止</text><text x="371" y="413" font-size="11" fill="#96434f">首版遇非空目标即终止</text><text x="371" y="436" font-size="11" fill="#96434f">本地音频文件与绝对路径不打包</text><text x="371" y="459" font-size="11" fill="#96434f">规模上限需基于实测再定稿</text><rect x="686" y="314" width="286" height="183" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="700" y="339" font-size="12.5" font-weight="700" fill="#316247">恢复应当可撤回</text><text x="700" y="367" font-size="11" fill="#316247">写入前保存隔离的回退副本</text><text x="700" y="390" font-size="11" fill="#316247">写入失败恢复此前状态</text><text x="700" y="413" font-size="11" fill="#316247">不自动启动云同步或清空旧内容</text><text x="700" y="436" font-size="11" fill="#316247">不擅定访客与登录后数据归属</text><text x="700" y="459" font-size="11" fill="#316247">生产操作仍有独立审批边界</text><rect x="28" y="526" width="944" height="69" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="42" y="550" font-size="12.5" font-weight="700" fill="#7a6234">待维护者在 PR 审阅</text><text x="42" y="576" font-size="11" fill="#7a6234">首发平台、空目标恢复规则、本地音频范围与文件规模上限均未定稿；本图不是可运行原型或已验收证明。</text></g></svg>