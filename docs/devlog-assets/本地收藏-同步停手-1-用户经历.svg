<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488"><rect x="1" y="1" width="958" height="486" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="26" y="37" font-size="19" fill="#282529" font-weight="700">同步停手与人工恢复（1/3 · 图稿待审）</text><text x="26" y="64" font-size="12.5" fill="#756f73" font-weight="400">已接通本地验证链路；真实账号、原生设备和生产验收仍单列。</text><text x="26" y="103" font-size="14" fill="#282529" font-weight="700">用户看到什么？</text><g data-card="true"><rect x="26" y="120" width="276" height="165" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="40" y="147" font-size="12.5" fill="#316247" font-weight="700">正常使用</text><text x="40" y="175" font-size="11" fill="#282529" font-weight="400">没有暂停提示，照常使用。</text><text x="40" y="198" font-size="11" fill="#282529" font-weight="400">背后：先保存待确认记录，</text><text x="40" y="221" font-size="11" fill="#282529" font-weight="400">确认落盘后才发同步请求。</text></g><g data-card="true"><rect x="342" y="120" width="276" height="165" rx="10" fill="#fdeef0" stroke="#d99aa5"/><text x="356" y="147" font-size="12.5" fill="#96434f" font-weight="700">遇到限制或服务异常</text><text x="356" y="175" font-size="11" fill="#282529" font-weight="400">“同步请求过多，自动同步已暂停”</text><text x="356" y="198" font-size="11" fill="#282529" font-weight="400">背景自动请求停止，</text><text x="356" y="221" font-size="11" fill="#282529" font-weight="400">不再定时探测恢复。</text></g><g data-card="true"><rect x="658" y="120" width="276" height="165" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="672" y="147" font-size="12.5" fill="#36566d" font-weight="700">明确确认后恢复</text><text x="672" y="175" font-size="11" fill="#282529" font-weight="400">点击“确认恢复同步”。</text><text x="672" y="198" font-size="11" fill="#282529" font-weight="400">旧确认不会清掉新限制；</text><text x="672" y="221" font-size="11" fill="#282529" font-weight="400">恢复失败仍保持暂停。</text></g><path d="M307 192H335m-6-5 6 5-6 5" stroke="#91adc1" stroke-width="2" fill="none"/><path d="M623 192H651m-6-5 6 5-6 5" stroke="#91adc1" stroke-width="2" fill="none"/><g data-card="true"><rect x="26" y="318" width="908" height="142" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="40" y="345" font-size="12.5" fill="#7a6234" font-weight="700">重要取舍：普通刷新也可能需要确认</text><text x="40" y="373" font-size="11" fill="#282529" font-weight="400">刷新或关闭时有在途请求（包含通知请求），下次进入会显示“上次同步结果未确认”。</text><text x="40" y="396" font-size="11" fill="#282529" font-weight="400">这是保守处理不确定结果，并非断言用户又被限流。此交互成本仍待维护者审阅。</text><text x="40" y="419" font-size="11" fill="#282529" font-weight="400">本地回归：限制后自动新增请求为0；已发出的请求不承诺撤回。</text></g></g></svg>