  <title id="title">多语言歌词对齐（2/3）：实测效果和界面文案</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker></defs>
  <rect x="1" y="1" width="1238" height="713" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
  <text x="34" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#282529">多语言歌词对齐（2/3）：实测效果和界面文案</text>
  <text x="34" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">结论：日语接近中文；英语换了模型后也接近中文；韩语只有 3 首有答案，样本不够下结论。数字都来自同一套评测：拿网易云 / 社区的人工逐字歌词当答案，看每行开始高亮的时刻</text>
  <text x="34" y="85" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">差多少（每首先扣掉这份投稿和网易云音源之间的固定差）。</text>
