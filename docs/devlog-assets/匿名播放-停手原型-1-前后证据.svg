<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="1038" height="588" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text x="28" y="40" font-size="19" font-weight="700" fill="#282529">匿名播放停手原型（1/2）｜本地前后证据</text><text x="28" y="66" font-size="12.5" fill="#756f73">结果：媒体报错后的额外请求减少；不是线上故障率，也不是完整修复。</text><rect x="28" y="92" width="480" height="148" rx="10" fill="#fdeef0" stroke="#d99aa5"/><text x="44" y="119" font-size="14" font-weight="700" fill="#96434f">用户看到的：原行为</text><text x="44" y="146" font-size="12" fill="#96434f">播放失败后继续提示：</text><text x="44" y="170" font-size="12" fill="#96434f">播放源失效（HTTP 429），正在重新获取…</text><text x="44" y="194" font-size="12" fill="#96434f">限制可能被当成普通地址过期处理。</text><rect x="532" y="92" width="480" height="148" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="548" y="119" font-size="14" font-weight="700" fill="#316247">用户看到的：当前候选</text><text x="548" y="146" font-size="12" fill="#316247">识别限制后暂停，保留当前歌曲。</text><text x="548" y="170" font-size="12" fill="#316247">播放源暂时拒绝请求，已停止自动重试</text><text x="548" y="194" font-size="12" fill="#316247">这些文案已写入代码；原页面故障复验待做。</text><rect x="28" y="260" width="480" height="146" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="44" y="287" font-size="14" font-weight="700" fill="#36566d">背后请求：错误事件后的实测</text><text x="44" y="314" font-size="12" fill="#36566d">429 / 503 合成本地响应：</text><text x="44" y="338" font-size="12" fill="#36566d">原件：2 次媒体诊断 + 1 次重新取址。</text><text x="44" y="362" font-size="12" fill="#36566d">候选：1 次媒体诊断 + 0 次重新取址。</text><rect x="532" y="260" width="480" height="146" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="548" y="287" font-size="14" font-weight="700" fill="#36566d">代理出站：独立实测，不与左侧相加</text><text x="548" y="314" font-size="12" fill="#36566d">连续提交 2 次受限媒体请求：</text><text x="548" y="338" font-size="12" fill="#36566d">原件：上游收到 2 次；注入候选：收到 1 次。</text><text x="548" y="362" font-size="12" fill="#36566d">第二次被本地拒绝；真实上游没有被探测。</text><rect x="28" y="430" width="984" height="130" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="44" y="457" font-size="14" font-weight="700" fill="#7a6234">审阅范围与常见情况</text><text x="44" y="484" font-size="12" fill="#7a6234">图稿待审；测试使用真实本地 HTTP、合成音频事件，不是线上用户数据。</text><text x="44" y="508" font-size="12" fill="#7a6234">正常播放仍沿原路径；遇到明确限制才停止自动恢复。</text><text x="44" y="532" font-size="12" fill="#7a6234">生产默认代理尚未接入新账本，管理员恢复入口及完整界面验收仍待完成。</text></svg>