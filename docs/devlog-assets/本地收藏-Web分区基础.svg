<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif} .title{font-size:19px;font-weight:700;fill:#282529}.sub{font-size:12.5px;fill:#756f73}.head{font-size:14px;font-weight:700}.body{font-size:12px}</style><rect x="1" y="1" width="998" height="448" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text class="title" x="24" y="34">Web 收藏隔离 · 非空追加合并（阶段 4）</text><text class="sub" x="24" y="59">已在合成非空目标上追加旧收藏；当前内容保留，生产身份与同步仍待验收。图稿待审。</text>
<rect x="24" y="84" width="458" height="180" rx="10" fill="#edf7f1" stroke="#7fad91"/><g fill="#316247"><text class="head" x="40" y="111">非空合并已实际跑通</text><text class="body" x="40" y="140">已有收藏 → 明确选择「合并到当前身份」。</text><text class="body" x="40" y="166">重复歌曲保留当前歌名、时间与位置。</text><text class="body" x="40" y="192">歌单、标签 ID 冲突重映射，关联跟随。</text><text class="body" x="40" y="218">标签追加去重；旧歌单可找回、播放。</text><text class="body" x="40" y="245">真实事务检查含 ID 冲突与旧选择保护。</text></g>
<rect x="510" y="84" width="466" height="180" rx="10" fill="#fff8e8" stroke="#d9bd85"/><g fill="#7a6234"><text class="head" x="526" y="111">保留的验收边界</text><text class="body" x="526" y="140">仅已识别旧协议；来源不明音频不猜测。</text><text class="body" x="526" y="166">更多旧格式与原件后续变化仍待覆盖。</text><text class="body" x="526" y="192">生产身份、同步、401、跨设备仍待验收。</text><text class="body" x="526" y="218">队列与搜索历史仍是设备级数据。</text><text class="body" x="526" y="245">生产开关强制关闭；不是完整隔离验收。</text></g>
<rect x="24" y="286" width="952" height="139" rx="10" fill="#eef4f8" stroke="#91adc1"/><g fill="#36566d"><text class="head" x="40" y="314">为什么不按同名覆盖歌单或照搬旧 ID？</text><text class="body" x="40" y="341">同名或同 ID 不代表同一歌单；保留当前歌单，冲突时给旧歌单新 ID，并保存映射。</text><text class="body" x="40" y="367">已有歌曲元数据不覆盖；标签关系追加且按资源身份落点，避免裸 ID 串到另一类媒体。</text><text class="body" x="40" y="393">常见情况：普通追加保留当前顺序；同一次认领只执行一次。归属、映射、原样副本同事务。</text></g></svg>