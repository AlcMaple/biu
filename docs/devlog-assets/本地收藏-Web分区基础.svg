<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif} .title{font-size:19px;font-weight:700;fill:#282529}.sub{font-size:12.5px;fill:#756f73}.head{font-size:14px;font-weight:700}.body{font-size:12px}</style><rect x="1" y="1" width="998" height="448" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text class="title" x="24" y="34">Web 收藏隔离 · 旧版明确恢复（阶段 3）</text><text class="sub" x="24" y="59">已在合成旧数据中恢复到明确选择的空身份；非空合并与生产仍待验收。图稿待审。</text>
<rect x="24" y="84" width="458" height="180" rx="10" fill="#edf7f1" stroke="#7fad91"/><g fill="#316247"><text class="head" x="40" y="111">旧数据恢复已实际跑通</text><text class="body" x="40" y="140">打开旧版样本 → 明确选择恢复到 A。</text><text class="body" x="40" y="166">暂不恢复 → 头像菜单仍能再次找到。</text><text class="body" x="40" y="192">旧歌单、歌名、标签保留，刷新后可播放。</text><text class="body" x="40" y="218">B 本地仍为空；A 重登不重复认领。</text><text class="body" x="40" y="245">93 项相关回归；8 项恢复事务检查通过。</text></g>
<rect x="510" y="84" width="466" height="180" rx="10" fill="#fff8e8" stroke="#d9bd85"/><g fill="#7a6234"><text class="head" x="526" y="111">保留的验收边界</text><text class="body" x="526" y="140">仅已识别旧格式、空目标；原件不删除。</text><text class="body" x="526" y="166">非空目标追加合并尚未实现。</text><text class="body" x="526" y="192">生产身份、同步、401、跨设备仍待验收。</text><text class="body" x="526" y="218">队列与搜索历史仍是设备级数据。</text><text class="body" x="526" y="245">生产开关强制关闭；不是完整隔离验收。</text></g>
<rect x="24" y="286" width="952" height="139" rx="10" fill="#eef4f8" stroke="#91adc1"/><g fill="#36566d"><text class="head" x="40" y="314">为什么不直接把原件给当前账号？</text><text class="body" x="40" y="341">旧原件没有可信账号归属；只有明确选择后才复制，不代用户认定是谁的收藏。</text><text class="body" x="40" y="367">归属记录、原样副本和目标快照同事务提交；失败整体回滚，不改写或删除旧原件。</text><text class="body" x="40" y="393">常见情况：同一来源成功恢复一次后不再询问；不同账号不重复取得。真实用户数据未迁移。</text></g></svg>