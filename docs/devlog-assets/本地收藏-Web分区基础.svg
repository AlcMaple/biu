<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif} .title{font-size:19px;font-weight:700;fill:#282529}.sub{font-size:12.5px;fill:#756f73}.head{font-size:14px;font-weight:700}.body{font-size:12px}</style><rect x="1" y="1" width="998" height="448" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text class="title" x="24" y="34">Web 收藏隔离 · 同页面预览（阶段 2）</text><text class="sub" x="24" y="59">全新沙箱数据的同源账号路径已跑通；生产、旧数据与云同步仍待验收。图稿待审。</text>
<rect x="24" y="84" width="458" height="180" rx="10" fill="#edf7f1" stroke="#7fad91"/><g fill="#316247"><text class="head" x="40" y="111">同一页面已实际跑通</text><text class="body" x="40" y="140">访客保存 1 首，A 选择「不并入」。</text><text class="body" x="40" y="166">A 另存自己的歌，访客收藏不混入。</text><text class="body" x="40" y="192">B 明确并入；访客原件与在线收藏夹保留。</text><text class="body" x="40" y="218">刷新、重登保留；访客新增后再次询问。</text><text class="body" x="40" y="245">本轮新增 16 项回归，相关测试 85 项通过。</text></g>
<rect x="510" y="84" width="466" height="180" rx="10" fill="#fff8e8" stroke="#d9bd85"/><g fill="#7a6234"><text class="head" x="526" y="111">保留的验收边界</text><text class="body" x="526" y="140">旧数据归属和恢复尚未接入。</text><text class="body" x="526" y="166">生产同步、401、跨设备仍待实现与验收。</text><text class="body" x="526" y="192">正式 Web 即使设置开关也不启用预览。</text><text class="body" x="526" y="218">播放队列与搜索历史仍是设备级数据。</text><text class="body" x="526" y="245">不是生产或整个浏览器的身份隔离验收。</text></g>
<rect x="24" y="286" width="952" height="139" rx="10" fill="#eef4f8" stroke="#91adc1"/><g fill="#36566d"><text class="head" x="40" y="314">为什么仅在全新沙箱数据中启用？</text><text class="body" x="40" y="341">旧数据归属与云同步切换尚未接通，直接启用会让已有歌单看起来像丢失，或误用旧基线。</text><text class="body" x="40" y="367">预览沿用原页面；确认身份后载入对应收藏，并入只改本地红心，不覆盖当前在线收藏夹。</text><text class="body" x="40" y="393">常见情况：同账号对相同访客内容不重复询问；内容变化才再问。未迁移或删除真实用户数据。</text></g></svg>