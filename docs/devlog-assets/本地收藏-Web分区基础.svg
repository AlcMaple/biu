<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif} .title{font-size:19px;font-weight:700;fill:#282529}.sub{font-size:12.5px;fill:#756f73}.head{font-size:14px;font-weight:700}.body{font-size:12px}</style><rect x="1" y="1" width="998" height="448" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text class="title" x="24" y="34">Web 收藏隔离 · 持久化基础（阶段 1）</text><text class="sub" x="24" y="59">数据层检查已通过；产品仍走旧存储，尚未切换。图稿待审，不代表完整功能验收。</text>
<rect x="24" y="84" width="458" height="180" rx="10" fill="#edf7f1" stroke="#7fad91"/><g fill="#316247"><text class="head" x="40" y="111">本阶段已落代码</text><text class="body" x="40" y="140">账号 A、账号 B、访客各有独立保存位置。</text><text class="body" x="40" y="166">明确选择后，只复制到目标账号的红心歌单。</text><text class="body" x="40" y="192">歌曲与选择一起保存；失败时访客原件不动。</text><text class="body" x="40" y="218">旧会话结束后，迟到操作停止；不落到新账号。</text><text class="body" x="40" y="245">实测：18 项新单测、9 项真实浏览器存储检查。</text></g>
<rect x="510" y="84" width="466" height="180" rx="10" fill="#fff8e8" stroke="#d9bd85"/><g fill="#7a6234"><text class="head" x="526" y="111">完整用户路径：仍待接入</text><text class="body" x="526" y="140">登录 → 载入自己的收藏，换账号不混用。</text><text class="body" x="526" y="166">有访客红心 → 弹窗询问「并入 / 不并入」。</text><text class="body" x="526" y="192">退出 → 只显示访客收藏，再登录可找回历史。</text><text class="body" x="526" y="218">升级 → 旧数据先保留，再明确认领归属。</text><text class="body" x="526" y="245">当前产品界面仍未达到以上行为。</text></g>
<rect x="24" y="286" width="952" height="139" rx="10" fill="#eef4f8" stroke="#91adc1"/><g fill="#36566d"><text class="head" x="40" y="314">为什么不现在打开分区？</text><text class="body" x="40" y="341">旧数据尚未认领，直接切换会让已有歌单看起来像丢失；登录协调未完成也会误用同步基线。</text><text class="body" x="40" y="367">先完成身份切换、旧数据归属与原页面复验，再启用；不以隐藏入口代替数据隔离。</text><text class="body" x="40" y="393">常见情况：已登录用户继续按账号云同步。本阶段未改云端协议，也未迁移或删除用户真实收藏。</text></g></svg>