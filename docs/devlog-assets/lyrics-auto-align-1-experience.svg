<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="986" viewBox="0 0 1240 986" role="img" aria-labelledby="title desc">
  <title id="title">歌词自动对齐（1/3）：用户会经历什么，背后在做什么</title>
  <desc id="desc">上半是用户四步，下半是背后对应在做的事，然后是边界情况和常见情况。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker></defs>
  <rect x="1" y="1" width="1238" height="984" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
  <text x="34.0" y="42.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#282529">歌词自动对齐（1/3）：用户会经历什么，背后在做什么</text>
  <text x="34.0" y="66.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">结论：普通听众什么都不用点。播到一首还没有逐字歌词的歌，服务器在后台对齐，约 2 分钟后歌词自己变成按真实演唱时间填色；第一个人对齐好的，之后所有人打开就是逐字歌词。</text>
  <text x="34.0" y="85.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73"></text>
  <rect x="24.0" y="112.0" width="1192.0" height="156.0" rx="10" fill="#ffffff" stroke="#c3bcc6" />
  <text x="44.0" y="141.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">① 用户看到的</text>
  <rect x="44.0" y="158.0" width="262.5" height="90.0" rx="9" fill="#edf7f1" stroke="#7fad91" />
  <text x="58.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">1 打开一首歌</text>
  <text x="58.0" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">歌词照常显示，每行按字数均摊逐字填色</text>
  <text x="58.0" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">（近似）。界面上没有多出任何东西。</text>
  <line x1="312.5" y1="203.0" x2="334.5" y2="203.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="340.5" y="158.0" width="262.5" height="90.0" rx="9" fill="#edf7f1" stroke="#7fad91" />
  <text x="354.5" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">2 照常听歌</text>
  <text x="354.5" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">没有提示条，不用点按钮。中途切到下一</text>
  <text x="354.5" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">首也不影响。</text>
  <line x1="609.0" y1="203.0" x2="631.0" y2="203.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="637.0" y="158.0" width="262.5" height="90.0" rx="9" fill="#edf7f1" stroke="#7fad91" />
  <text x="651.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">3 约 2 分钟后</text>
  <text x="651.0" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">歌词自己换成按真实演唱时间的逐字填色，</text>
  <text x="651.0" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">从下一句起和演唱对上。</text>
  <line x1="905.5" y1="203.0" x2="927.5" y2="203.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="933.5" y="158.0" width="262.5" height="90.0" rx="9" fill="#edf7f1" stroke="#7fad91" />
  <text x="947.5" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">4 下次 / 别人再听</text>
  <text x="947.5" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">一打开就是逐字歌词，不再排队、不再等。</text>
  <text x="947.5" y="222.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247"></text>
  <rect x="24.0" y="284.0" width="1192.0" height="190.0" rx="10" fill="#ffffff" stroke="#c3bcc6" />
  <text x="44.0" y="313.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">② 背后在做的（和上面一一对应）</text>
  <rect x="44.0" y="330.0" width="262.5" height="124.0" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="58.0" y="356.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">先问服务器有没有生效版本</text>
  <text x="58.0" y="377.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">有就直接用。没有、且本机歌词还没有逐</text>
  <text x="58.0" y="394.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">字时间，才准备发起对齐。</text>
  <line x1="312.5" y1="392.0" x2="334.5" y2="392.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="340.5" y="330.0" width="262.5" height="124.0" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="354.5" y="356.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">听满 5 秒才排队</text>
  <text x="354.5" y="377.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">连着往下切的歌不占服务器。每首歌的每</text>
  <text x="354.5" y="394.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">份歌词，每次打开应用只发一次。</text>
  <line x1="609.0" y1="392.0" x2="631.0" y2="392.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="637.0" y="330.0" width="262.5" height="124.0" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="651.0" y="356.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">服务器排队、对齐</text>
  <text x="651.0" y="377.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">取 B 站音频约 3 秒，分离人声 + 对齐</text>
  <text x="651.0" y="394.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">约 100 秒（实测，一次只跑一首）。客</text>
  <text x="651.0" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">户端每 3 秒查一次进度，只查正在播的</text>
  <text x="651.0" y="428.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">那首。</text>
  <line x1="905.5" y1="392.0" x2="927.5" y2="392.0" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="933.5" y="330.0" width="262.5" height="124.0" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="947.5" y="356.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">成功即对所有人生效</text>
  <text x="947.5" y="377.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">这首歌还没有生效版本时，第一份对齐结</text>
  <text x="947.5" y="394.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">果直接生效，不经审核。已有的上传版本、</text>
  <text x="947.5" y="411.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">管理员发布的版本不会被覆盖。</text>
  <rect x="24.0" y="490.0" width="1192.0" height="381.0" rx="10" fill="#ffffff" stroke="#c3bcc6" />
  <text x="44.0" y="519.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">③ 边界情况</text>
  <rect x="44.0" y="536.0" width="373.3" height="107.0" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="58.0" y="562.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">切歌了</text>
  <text x="58.0" y="583.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">停止查进度；服务器照常算完并存下。下次再播直接拿到结果，</text>
  <text x="58.0" y="600.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">不重新排队。</text>
  <rect x="433.3" y="536.0" width="373.3" height="107.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="447.3" y="562.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">歌词和音频对不上</text>
  <text x="447.3" y="583.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">歌词区顶部出现提示和「换一份歌词」按钮。服务器记住这份</text>
  <text x="447.3" y="600.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">歌词对不上，后面的听众直接得到同样结果，不再白排 2 分</text>
  <text x="447.3" y="617.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">钟。</text>
  <rect x="822.7" y="536.0" width="373.3" height="107.0" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="836.7" y="562.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">日语等暂不支持、歌词太长、投稿超过 10 分钟</text>
  <text x="836.7" y="583.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">不弹提示，只记日志。用户对它无能为力，每首都弹只是打扰。</text>
  <text x="836.7" y="600.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450"></text>
  <rect x="44.0" y="657.0" width="373.3" height="90.0" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="58.0" y="683.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">没登录</text>
  <text x="58.0" y="704.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">不发起对齐（要用登录身份），但照样能用别人对齐好的版本。</text>
  <text x="58.0" y="721.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450"></text>
  <rect x="433.3" y="657.0" width="373.3" height="90.0" rx="9" fill="#fff8e8" stroke="#d9bd85" />
  <text x="447.3" y="683.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">点过「还原为对齐前的歌词」</text>
  <text x="447.3" y="704.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">这首歌之后不再自动对齐，否则下次打开又被换回来，还原等</text>
  <text x="447.3" y="721.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">于没点。</text>
  <rect x="822.7" y="657.0" width="373.3" height="90.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="836.7" y="683.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">被管理员确认有误、下线</text>
  <text x="836.7" y="704.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">下次打开这首歌，本机自动退回对齐前的歌词。</text>
  <rect x="44.0" y="761.0" width="373.3" height="90.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="58.0" y="787.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">查进度失败（断网、被限流）</text>
  <text x="58.0" y="808.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">提示条写明原因，给「继续查询」。不自动重试：被限流时重</text>
  <text x="58.0" y="825.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">试只会延长限制。</text>
  <rect x="433.3" y="761.0" width="373.3" height="90.0" rx="9" fill="#fff8e8" stroke="#d9bd85" />
  <text x="447.3" y="787.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">等结果期间用户换了歌词</text>
  <text x="447.3" y="808.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">结果回来时先核对：本机歌词已经不是送去对齐的那份，就不</text>
  <text x="447.3" y="825.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">覆盖。</text>
  <rect x="822.7" y="761.0" width="373.3" height="90.0" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="836.7" y="787.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">本地音乐</text>
  <text x="836.7" y="808.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">没有 B 站投稿可取音频，不对齐。</text>
  <rect x="24.0" y="887.0" width="1192.0" height="73.0" rx="10" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="44.0" y="916.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">④ 常见情况</text>
  <text x="44.0" y="937.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#756f73">大多数时候用户只会注意到「这首歌的歌词变成逐字的了」。歌词区顶部的提示条只在两种时候出现：需要用户换一份歌词，或者网络出了问题。</text>
</svg>
