<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="1" y="1" width="1038" height="588" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><text x="28" y="40" font-size="19" font-weight="700" fill="#282529">匿名播放停手原型（2/2）｜恢复与未完成边界</text><text x="28" y="66" font-size="12.5" fill="#756f73">结果：本地匿名故障恢复已实测；未部署，真实上游与实机仍待验收。</text><rect x="28" y="92" width="480" height="172" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="44" y="119" font-size="14" font-weight="700" fill="#316247">已经实现并验证</text><text x="44" y="146" font-size="12" fill="#316247">出站前记录意图；未确认的旧请求重开后停手。</text><text x="44" y="170" font-size="12" fill="#316247">限制记录跨实例保留，坏记录拒绝而不清空。</text><text x="44" y="194" font-size="12" fill="#316247">旧确认不清新限制；恢复写入失败不放行。</text><text x="44" y="218" font-size="12" fill="#316247">裸 403 / 412 不直接猜测为风控。</text><rect x="532" y="92" width="480" height="172" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="548" y="119" font-size="14" font-weight="700" fill="#36566d">为什么不直接继续试</text><text x="548" y="146" font-size="12" fill="#36566d">429 / 5xx 不等于地址过期，不能自动探恢复。</text><text x="548" y="170" font-size="12" fill="#36566d">未知请求结果不因时间过去就视为成功。</text><text x="548" y="194" font-size="12" fill="#36566d">匿名访问者不应清掉全站出口保护。</text><text x="548" y="218" font-size="12" fill="#36566d">只删除一次重试，挡不住其他页面继续请求。</text><rect x="28" y="284" width="480" height="156" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="44" y="311" font-size="14" font-weight="700" fill="#7a6234">持久化暂停与人工恢复：互不等价</text><text x="44" y="338" font-size="12" fill="#7a6234">恢复要求：当前版本号与明确确认。</text><text x="44" y="362" font-size="12" fill="#7a6234">已做：服务入口接线、本机确认恢复命令。</text><text x="44" y="386" font-size="12" fill="#7a6234">未新增公共恢复接口，未扩大匿名权限。</text><text x="44" y="410" font-size="12" fill="#7a6234">作用域和保守停手的使用成本仍待审。</text><rect x="532" y="284" width="480" height="156" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="548" y="311" font-size="14" font-weight="700" fill="#7a6234">仍未覆盖的合并门槛</text><text x="548" y="338" font-size="12" fill="#7a6234">更多播放入口组合与并发交错情况。</text><text x="548" y="362" font-size="12" fill="#7a6234">更多故障组合、真实分享接收者验收。</text><text x="548" y="386" font-size="12" fill="#7a6234">多进程、实际磁盘故障、Windows 和开销。</text><text x="548" y="410" font-size="12" fill="#7a6234">上线监控与真实匿名播放成功率。</text><rect x="28" y="460" width="984" height="100" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="44" y="487" font-size="14" font-weight="700" fill="#36566d">这不是合并或部署许可</text><text x="44" y="514" font-size="12" fill="#36566d">先提交阶段性 Draft 供审阅；未实现的能力保留清单，沿同一 PR 继续。</text><text x="44" y="538" font-size="12" fill="#36566d">现有正常播放路径不应被误拦；不靠强制登录或借用他人身份解决匿名播放问题。</text></svg>