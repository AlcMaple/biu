<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Web 推荐请求的跨域故障与恢复链路</title>
  <desc id="desc">旧链路由浏览器直连 Bilibili，跨域失败后空列表继续自动分页形成请求风暴；新链路改走固定同源代理，失败时停止分页并只保留手动重试。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e5e7eb; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e5e7eb; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .box { stroke-width: 2; rx: 14; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .error-line { fill: none; stroke: #ef4444; stroke-width: 3; marker-end: url(#arrow); }
      .ok-line { fill: none; stroke: #22c55e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="640" fill="#0f172a" rx="20" />
  <text x="44" y="48" class="title">Web 推荐页：从 CORS 请求风暴到同源可控失败</text>

  <rect x="34" y="78" width="1052" height="226" fill="#1e293b" stroke="#475569" class="box" />
  <text x="58" y="112" class="section">修复前</text>

  <rect x="60" y="142" width="178" height="76" fill="#334155" stroke="#64748b" class="box" />
  <text x="149" y="175" text-anchor="middle" class="label">localhost 页面</text>
  <text x="149" y="198" text-anchor="middle" class="small">Renderer Axios</text>

  <rect x="330" y="142" width="210" height="76" fill="#451a1a" stroke="#ef4444" class="box" />
  <text x="435" y="175" text-anchor="middle" class="label">Bilibili API</text>
  <text x="435" y="198" text-anchor="middle" class="small">403 / 无 CORS 许可</text>

  <rect x="632" y="142" width="188" height="76" fill="#451a1a" stroke="#ef4444" class="box" />
  <text x="726" y="175" text-anchor="middle" class="label">空列表</text>
  <text x="726" y="198" text-anchor="middle" class="small">hasMore 仍为 true</text>

  <rect x="900" y="142" width="160" height="76" fill="#451a1a" stroke="#ef4444" class="box" />
  <text x="980" y="175" text-anchor="middle" class="label">自动分页</text>
  <text x="980" y="198" text-anchor="middle" class="small">立即再次请求</text>

  <path d="M 238 180 L 330 180" class="error-line" />
  <path d="M 540 180 L 632 180" class="error-line" />
  <path d="M 820 180 L 900 180" class="error-line" />
  <path d="M 980 218 C 980 278, 149 278, 149 219" class="error-line" />
  <text x="560" y="276" text-anchor="middle" class="small">失败 Promise 冒泡 + loading 解锁，循环继续</text>

  <rect x="34" y="330" width="1052" height="270" fill="#1e293b" stroke="#475569" class="box" />
  <text x="58" y="364" class="section">修复后</text>

  <rect x="60" y="398" width="178" height="76" fill="#064e3b" stroke="#22c55e" class="box" />
  <text x="149" y="431" text-anchor="middle" class="label">localhost 页面</text>
  <text x="149" y="454" text-anchor="middle" class="small">只访问同源固定前缀</text>

  <rect x="310" y="386" width="240" height="100" fill="#064e3b" stroke="#22c55e" class="box" />
  <text x="430" y="419" text-anchor="middle" class="label">Rsbuild 固定代理</text>
  <text x="430" y="444" text-anchor="middle" class="small">固定目标域 + 移除路径前缀</text>
  <text x="430" y="466" text-anchor="middle" class="small">补 Origin / Referer / UA</text>

  <rect x="632" y="398" width="188" height="76" fill="#064e3b" stroke="#22c55e" class="box" />
  <text x="726" y="431" text-anchor="middle" class="label">Bilibili API</text>
  <text x="726" y="454" text-anchor="middle" class="small">返回推荐数据</text>

  <rect x="900" y="398" width="160" height="76" fill="#064e3b" stroke="#22c55e" class="box" />
  <text x="980" y="431" text-anchor="middle" class="label">正常列表</text>
  <text x="980" y="454" text-anchor="middle" class="small">按需继续分页</text>

  <path d="M 238 436 L 310 436" class="ok-line" />
  <path d="M 550 436 L 632 436" class="ok-line" />
  <path d="M 820 436 L 900 436" class="ok-line" />

  <rect x="310" y="520" width="510" height="52" fill="#3f2b0d" stroke="#f59e0b" class="box" />
  <text x="565" y="543" text-anchor="middle" class="label">上游失败：hasMore=false，Spinner 收起</text>
  <text x="565" y="563" text-anchor="middle" class="small">界面显示原因；只有用户点击“重试”才再次请求</text>
  <path d="M 726 474 L 726 500 L 565 500 L 565 520" class="line" />
</svg>
