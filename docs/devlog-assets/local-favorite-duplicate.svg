<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">本地歌单分P二次收藏数据流</title>
  <desc id="desc">本地歌单条目带着 rid、cid 和用户标题进入本地路径，跳过 B 站分P请求，写入目标本地歌单时保留同一身份与标题。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .text { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f5026; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 12; }
      .green { fill: #e8f5e9; stroke: #1a7f37; stroke-width: 1.5; rx: 12; }
      .line { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8c959f; stroke-width: 1.3; stroke-dasharray: 5 5; fill: none; }
    </style>
  </defs>

  <rect width="980" height="390" fill="#ffffff"/>
  <text x="36" y="38" class="title">本地歌单分P二次收藏：沿用条目身份，不重新解析整稿</text>

  <rect x="36" y="82" width="240" height="118" class="box"/>
  <text x="56" y="111" class="label">源歌单条目</text>
  <text x="56" y="137" class="mono">rid = cid = 987654</text>
  <text x="56" y="158" class="mono">title = 用户自定义标题</text>
  <text x="56" y="179" class="text">同时带 bvid / page / partTitle</text>

  <rect x="350" y="82" width="260" height="118" class="green"/>
  <text x="370" y="111" class="label">toLocalFavoriteModalData</text>
  <text x="370" y="137" class="mono">fromLocalFavorite = true</text>
  <text x="370" y="158" class="text">把 rid、cid、标题和分集元数据原样传入</text>
  <text x="370" y="179" class="text">身份判断不依赖标题文本</text>

  <rect x="684" y="68" width="260" height="146" class="green"/>
  <text x="704" y="97" class="label">收藏弹窗 · 本地路径</text>
  <text x="704" y="123" class="text">跳过 getWebInterfaceView</text>
  <text x="704" y="143" class="text">跳过 B 站收藏夹列表请求</text>
  <text x="704" y="163" class="text">只展示本地歌单，预选源歌单</text>
  <text x="704" y="190" class="mono">localRid = cid</text>

  <path d="M 276 141 L 350 141" class="line"/>
  <path d="M 610 141 L 684 141" class="line"/>

  <rect x="350" y="266" width="260" height="82" class="box"/>
  <text x="370" y="294" class="label">resolveLocalFavoriteSelection</text>
  <text x="370" y="316" class="mono">title = 原标题（不追加 -P32）</text>
  <text x="370" y="336" class="text">继续保留 cid / page / partTitle</text>

  <rect x="684" y="266" width="260" height="82" class="green"/>
  <text x="704" y="294" class="label">目标本地歌单</text>
  <text x="704" y="316" class="text">addOnlineItemToLocalFav</text>
  <text x="704" y="336" class="mono">同 cid + 同用户标题</text>

  <path d="M 814 214 L 814 266" class="line"/>
  <path d="M 610 307 L 684 307" class="line"/>
  <path d="M 814 214 C 814 236 480 230 480 266" class="dash"/>
  <text x="44" y="377" class="text">普通搜索 / 合集收藏不带 fromLocalFavorite，仍走原有分P选择与 B 站收藏逻辑。</text>
</svg>
