<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676"><rect x="1" y="1" width="958" height="674" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="26" y="37" font-size="19" fill="#282529" font-weight="700">暂停提示与可做动作（3/3 · 图稿待审）</text><text x="26" y="64" font-size="12.5" fill="#756f73" font-weight="400">本轮保留具体原因，不用“网络请求失败”覆盖所有异常。</text><text x="26" y="102" font-size="12.5" fill="#756f73" font-weight="400">提示只在页面顶部、需要行动时出现；正常状态不占说明条。</text><text x="42" y="140" font-size="12.5" fill="#282529" font-weight="700">实际文案</text><text x="560" y="140" font-size="12.5" fill="#282529" font-weight="700">什么情况下出现</text><text x="812" y="140" font-size="12.5" fill="#282529" font-weight="700">用户可做什么</text><rect x="26" y="155" width="908" height="46" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="42" y="183" font-size="11" fill="#282529" font-weight="400">同步请求过多，自动同步已暂停</text><text x="560" y="183" font-size="11" fill="#282529" font-weight="400">收到请求过多限制</text><text x="812" y="183" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="207" width="908" height="46" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="235" font-size="11" fill="#282529" font-weight="400">同步请求被限制，自动同步已暂停</text><text x="560" y="235" font-size="11" fill="#282529" font-weight="400">收到已列明风控信号</text><text x="812" y="235" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="259" width="908" height="46" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="42" y="287" font-size="11" fill="#282529" font-weight="400">同步服务暂不可用，自动同步已暂停</text><text x="560" y="287" font-size="11" fill="#282529" font-weight="400">收到服务端错误</text><text x="812" y="287" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="311" width="908" height="46" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="339" font-size="11" fill="#282529" font-weight="400">上次同步结果未确认，自动同步已暂停</text><text x="560" y="339" font-size="11" fill="#282529" font-weight="400">原页面关闭，仍有未结请求</text><text x="812" y="339" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="363" width="908" height="46" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="42" y="391" font-size="11" fill="#282529" font-weight="400">同步响应未确认，自动同步已暂停</text><text x="560" y="391" font-size="11" fill="#282529" font-weight="400">响应不是预期的结构化结果</text><text x="812" y="391" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="415" width="908" height="46" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="443" font-size="11" fill="#282529" font-weight="400">同步保护记录读写失败，自动同步已暂停</text><text x="560" y="443" font-size="11" fill="#282529" font-weight="400">未读出本机记录</text><text x="812" y="443" font-size="11" fill="#282529" font-weight="400">检查本机记录</text><rect x="26" y="467" width="908" height="46" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="42" y="495" font-size="11" fill="#282529" font-weight="400">同步保护记录读写失败，自动同步已暂停</text><text x="560" y="495" font-size="11" fill="#282529" font-weight="400">已读出待确认记录</text><text x="812" y="495" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><rect x="26" y="519" width="908" height="46" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="547" font-size="11" fill="#282529" font-weight="400">当前环境不支持跨页面同步保护，自动同步未启动</text><text x="560" y="547" font-size="11" fill="#282529" font-weight="400">缺少所需本机保护能力</text><text x="812" y="547" font-size="11" fill="#282529" font-weight="400">检查本机记录</text><rect x="26" y="571" width="908" height="46" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="42" y="599" font-size="11" fill="#282529" font-weight="400">暂停状态已变化，请重新确认</text><text x="560" y="599" font-size="11" fill="#282529" font-weight="400">旧确认遇到较新记录</text><text x="812" y="599" font-size="11" fill="#282529" font-weight="400">确认恢复同步</text><text x="26" y="650" font-size="11" fill="#756f73" font-weight="400">“检查本机记录”只读本地；拿到记录后才提供确认恢复。没有静默恢复探测。</text></g></svg>