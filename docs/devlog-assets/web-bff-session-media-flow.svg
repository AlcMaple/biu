<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">Web 登录、固定 API 代理与受限音频流代理</title>
  <desc id="desc">浏览器只持有本站会话，B 站凭据留在同源服务；API 只能访问固定上游，播放地址改写为会话绑定的随机令牌，媒体请求透传 Range。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 16; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1240" height="720" fill="#f8fafc"/>
  <text x="620" y="48" text-anchor="middle" class="title">Web 同源服务：凭据留在服务端，媒体地址只下发随机令牌</text>

  <rect x="40" y="110" width="260" height="490" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="170" y="148" text-anchor="middle" class="heading">浏览器 Renderer</text>
  <text x="68" y="188" class="body">• 共享 React 界面</text>
  <text x="68" y="220" class="body">• 只请求本站 /__biu_*</text>
  <text x="68" y="252" class="body">• HttpOnly 会话不可被 JS 读取</text>
  <text x="68" y="284" class="body">• 写请求只发内部 CSRF 标记</text>
  <text x="68" y="332" class="heading">登录</text>
  <text x="68" y="362" class="small">二维码 ID 为一次性随机值</text>
  <text x="68" y="388" class="small">致命状态停止轮询，由用户重试</text>
  <text x="68" y="436" class="heading">播放</text>
  <text x="68" y="466" class="small">audio.src = /media/&lt;opaque-token&gt;</text>
  <text x="68" y="492" class="small">浏览器 seek 继续发送 Range</text>
  <text x="68" y="540" class="heading">图片</text>
  <text x="68" y="570" class="small">HTTPS + no-referrer 直连 CDN</text>

  <rect x="400" y="82" width="430" height="570" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="615" y="122" text-anchor="middle" class="heading">Biu 同源 Web 服务</text>

  <rect x="430" y="155" width="370" height="120" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="455" y="187" class="heading">会话与扫码登录</text>
  <text x="455" y="218" class="small">服务端 Cookie jar + refresh_token</text>
  <text x="455" y="244" class="small">Origin/Host 校验、限流、过期清理</text>

  <rect x="430" y="305" width="370" height="120" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="455" y="337" class="heading">固定 API 代理</text>
  <text x="455" y="368" class="small">仅 5 个写死上游；注入 Cookie / CSRF</text>
  <text x="455" y="394" class="small">合并 Set-Cookie，不回传第三方凭据</text>

  <rect x="430" y="455" width="370" height="160" class="box" fill="#ffffff" stroke="#34d399"/>
  <text x="455" y="487" class="heading">受限媒体流代理</text>
  <text x="455" y="518" class="small">playurl 中的 CDN URL → 随机会话令牌</text>
  <text x="455" y="544" class="small">每次重定向重新校验 UPOS allowlist</text>
  <text x="455" y="570" class="small">透传 Range / 206 / Content-Range</text>
  <text x="455" y="596" class="small">浏览器取消时立即中止上游连接</text>

  <rect x="930" y="110" width="270" height="490" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="1065" y="148" text-anchor="middle" class="heading">Bilibili 固定上游</text>
  <text x="960" y="200" class="body">api.bilibili.com</text>
  <text x="960" y="232" class="body">passport.bilibili.com</text>
  <text x="960" y="264" class="body">www.bilibili.com</text>
  <text x="960" y="296" class="body">member.bilibili.com</text>
  <text x="960" y="328" class="body">s.search.bilibili.com</text>
  <line x1="960" y1="356" x2="1170" y2="356" stroke="#fdba74" stroke-width="2"/>
  <text x="960" y="400" class="heading">受限媒体 CDN</text>
  <text x="960" y="432" class="small">仅 HTTPS / 443</text>
  <text x="960" y="458" class="small">仅 UPOS 稳定域名与资源路径</text>
  <text x="960" y="484" class="small">拒绝 PCDN、任意 URL 与内网地址</text>
  <text x="960" y="532" class="heading">真实流量边界</text>
  <text x="960" y="562" class="small">音频字节经过部署方服务器</text>

  <path d="M300 208 H430" class="flow"/>
  <text x="365" y="194" text-anchor="middle" class="small">登录 / API</text>
  <path d="M300 500 H430" class="flow"/>
  <text x="365" y="486" text-anchor="middle" class="small">Range</text>
  <path d="M800 365 H930" class="flow"/>
  <text x="865" y="351" text-anchor="middle" class="small">固定路由</text>
  <path d="M800 535 H930" class="flow"/>
  <text x="865" y="521" text-anchor="middle" class="small">令牌解析</text>
  <path d="M930 570 H830" class="flow dashed"/>
  <text x="880" y="594" text-anchor="middle" class="small">206 流</text>

  <text x="620" y="690" text-anchor="middle" class="small">生产环境必须运行同源服务并由 HTTPS 反向代理转发；纯静态文件服务器无法提供登录与播放能力。</text>
</svg>
