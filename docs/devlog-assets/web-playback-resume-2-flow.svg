<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="769" viewBox="0 0 1160 769" role="img" aria-labelledby="title desc">
  <title id="title">网页版播放（2/3）：点播放之后背后怎么走</title>
  <desc id="desc">正常续播链路与地址被拒时的自救顺序，含用户实际看到的提示原文。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker>
    <style>
      .title { font: 700 19px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .subtitle { font: 12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .block { font: 700 14px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .card-t { font: 700 12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .body { font: 11px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="1158" height="767" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
  <text x="34" y="42" class="title" fill="#282529">网页版播放（2/3）：点播放之后背后怎么走</text>
  <text x="34" y="64" class="subtitle" fill="#756f73">地址快过期就提前换新的；被拒时先重新取址，救不回来才换源或跳过，每首最多 3 次。</text>
  <rect x="24" y="84" width="1112" height="214" rx="10" fill="#eef4f8" stroke="#91adc1" />
  <text x="44" y="112" class="block" fill="#282529">① 暂停很久后点播放（上：用户看到的 · 下：背后在做的）</text>
  <text x="44" y="144" class="card-t" fill="#36566d">用户看到的</text>
  <rect x="150" y="126" width="200" height="30" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="250.0" y="149" text-anchor="middle" class="card-t" fill="#4a4450">点 ▶</text>
  <rect x="394" y="126" width="200" height="30" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="494.0" y="149" text-anchor="middle" class="card-t" fill="#4a4450">进度条停在 1:30</text>
  <line x1="354" y1="141" x2="388" y2="141" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="638" y="126" width="200" height="30" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="738.0" y="149" text-anchor="middle" class="card-t" fill="#4a4450">稍等片刻后出声</text>
  <line x1="598" y1="141" x2="632" y2="141" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="882" y="126" width="200" height="30" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="982.0" y="149" text-anchor="middle" class="card-t" fill="#4a4450">从 1:30 接着播</text>
  <line x1="842" y1="141" x2="876" y2="141" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <line x1="44" y1="176" x2="1116" y2="176" stroke="#c3bcc6" stroke-dasharray="4 4" />
  <text x="44" y="208" class="card-t" fill="#36566d">背后在做的</text>
  <rect x="150" y="188" width="200" height="80" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="164" y="211" class="card-t" fill="#36566d">看地址还能用多久</text>
  <text x="164" y="232" class="body" fill="#36566d">地址都带到期时间</text>
  <text x="164" y="251" class="body" fill="#36566d">不足 2 分钟就当过期</text>
  <rect x="394" y="188" width="200" height="80" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="408" y="211" class="card-t" fill="#36566d">过期就重新要地址</text>
  <text x="408" y="232" class="body" fill="#36566d">同一首只发一次请求</text>
  <text x="408" y="251" class="body" fill="#36566d">不先试必死的旧地址</text>
  <line x1="354" y1="224" x2="388" y2="224" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="638" y="188" width="200" height="80" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="652" y="211" class="card-t" fill="#36566d">从 1:30 附近开始取</text>
  <text x="652" y="232" class="body" fill="#36566d">iPhone 先取那段数据</text>
  <text x="652" y="251" class="body" fill="#36566d">到了才挪播放位置</text>
  <line x1="598" y1="224" x2="632" y2="224" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="882" y="188" width="200" height="80" rx="9" fill="#edf7f1" stroke="#7fad91" />
  <text x="896" y="211" class="card-t" fill="#316247">出声</text>
  <text x="896" y="232" class="body" fill="#316247">没过期的地址直接播</text>
  <text x="896" y="251" class="body" fill="#316247">不多发任何请求</text>
  <line x1="842" y1="224" x2="876" y2="224" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="24" y="314" width="1112" height="399" rx="10" fill="#fdeef0" stroke="#d99aa5" />
  <text x="44" y="342" class="block" fill="#282529">② 意外：地址没到期却被拒（服务器重启过 / 登录会话变了）</text>
  <rect x="44" y="360" width="1072" height="99" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="58" y="383" class="card-t" fill="#96434f">1. 播放出错或卡住</text>
  <text x="58" y="404" class="body" fill="#96434f">以前：iPhone 上拿到的是播放器内部临时地址，</text>
  <text x="58" y="423" class="body" fill="#96434f">认不出是本站转发的地址，只能把一批旧地址挨个试；</text>
  <text x="58" y="442" class="body" fill="#96434f">这批地址是同一次申请拿到的，要失效一起失效。</text>
  <line x1="580" y1="461" x2="580" y2="473" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="44" y="475" width="1072" height="99" rx="9" fill="#eef4f8" stroke="#91adc1" />
  <text x="58" y="498" class="card-t" fill="#36566d">2. 现在：先重新要地址</text>
  <text x="58" y="519" class="body" fill="#36566d">按真实地址判断，认出是本站转发的地址，</text>
  <text x="58" y="538" class="body" fill="#36566d">直接重新取址并保留进度。</text>
  <text x="58" y="557" class="body" fill="#36566d">提示：「播放源失效（HTTP 404），正在重新获取…」</text>
  <line x1="580" y1="576" x2="580" y2="588" stroke="#8f8792" stroke-width="1.6" marker-end="url(#ah)" />
  <rect x="44" y="590" width="1072" height="99" rx="9" fill="#fff8e8" stroke="#d9bd85" />
  <text x="58" y="613" class="card-t" fill="#7a6234">3. 还是不行才换源或跳过</text>
  <text x="58" y="634" class="body" fill="#7a6234">每首最多自救 3 次，不会无限重试；</text>
  <text x="58" y="653" class="body" fill="#7a6234">连续几首都失败就停下，提示：</text>
  <text x="58" y="672" class="body" fill="#7a6234">「当前歌曲无法播放，请检查网络后重试」</text>
  <text x="44" y="739" class="body" fill="#4a4450">常见情况：绝大多数播放走「地址没过期 → 直接出声」；重新取址只发生在暂停很久、刚发布新版或会话变化之后。</text>
</svg>
