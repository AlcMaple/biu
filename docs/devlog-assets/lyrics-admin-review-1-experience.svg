<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="776" viewBox="0 0 1240 776" role="img">
<title>歌词审核流程优化（1/3）：管理员处理报错，以前 vs 现在</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker></defs>
<rect x="1" y="1" width="1238" height="774" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
<text x="34.0" y="42.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#282529">歌词审核流程优化（1/3）：管理员处理报错，以前 vs 现在</text>
<text x="34.0" y="66.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">结论：重新对齐的结果先放在「待发布」里，管理员确认后才替换大家在用的版本；切歌再回来能接着试听，不用整首重跑。</text>
<g transform="translate(0,0)">
<rect x="24" y="95" width="1192" height="146" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">① 管理员处理一条报错：以前</text>
<rect x="44.0" y="139" width="270.0" height="82" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
<text x="58.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">看到报错</text>
<text x="58.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">审核页只有被报的那份，没法和别的版本对</text>
<text x="58.0" y="201.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">照</text>
<line x1="317.0" y1="180.0" x2="335.0" y2="180.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="338.0" y="139" width="270.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="352.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">点「重新对齐」</text>
<text x="352.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">新结果一出来就直接替换了大家在用的版本，</text>
<text x="352.0" y="201.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">还没试听就已经上线</text>
<line x1="611.0" y1="180.0" x2="629.0" y2="180.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="632.0" y="139" width="270.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="646.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">试听不满意，点「放弃」</text>
<text x="646.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">放弃不掉：原来那份已被覆盖，报错详情里</text>
<text x="646.0" y="201.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">被报的版本也跟着变了</text>
<line x1="905.0" y1="180.0" x2="923.0" y2="180.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="926.0" y="139" width="270.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="940.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">切歌后回来</text>
<text x="940.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">试听状态没了，再对齐一次又要整首从头跑</text>
<rect x="24" y="259" width="1192" height="146" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="288.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">② 现在</text>
<rect x="44.0" y="303" width="270.0" height="82" rx="9" fill="#eef4f8" stroke="#91adc1" />
<text x="58.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">审核页点「重新对齐对照」</text>
<text x="58.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">在审核页里直接重跑，结果放进「待发布」，</text>
<text x="58.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">大家用的仍是原来那份</text>
<line x1="317.0" y1="344.0" x2="335.0" y2="344.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="338.0" y="303" width="270.0" height="82" rx="9" fill="#edf7f1" stroke="#7fad91" />
<text x="352.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">左右并排对照</text>
<text x="352.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">左边被报的版本，右边重跑结果，逐行比较</text>
<line x1="611.0" y1="344.0" x2="629.0" y2="344.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="632.0" y="303" width="270.0" height="82" rx="9" fill="#edf7f1" stroke="#7fad91" />
<text x="646.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">三选一处理</text>
<text x="646.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">没问题，驳回 / 下线，退回原歌词 / 用</text>
<text x="646.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">重跑结果替换</text>
<line x1="905.0" y1="344.0" x2="923.0" y2="344.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="926.0" y="303" width="270.0" height="82" rx="9" fill="#edf7f1" stroke="#7fad91" />
<text x="940.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">报错自动关闭</text>
<text x="940.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">替换后同一首歌的待处理报错一起关闭，报</text>
<text x="940.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">错人看到「已换成管理员重新对齐的版本」</text>
<rect x="24" y="423" width="1192" height="163" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="452.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">③ 在播放器里试听：切歌再回来</text>
<rect x="44.0" y="467" width="270.0" height="99" rx="9" fill="#eef4f8" stroke="#91adc1" />
<text x="58.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#36566d">试听重跑结果</text>
<text x="58.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#36566d">歌词区显示「试听中」，可点「再跑一遍」</text>
<line x1="317.0" y1="516.5" x2="335.0" y2="516.5" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="338.0" y="467" width="270.0" height="99" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
<text x="352.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">切到别的歌</text>
<text x="352.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">试听只存在服务器的「待发布」里，本机不</text>
<text x="352.0" y="529.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">用记</text>
<line x1="611.0" y1="516.5" x2="629.0" y2="516.5" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="632.0" y="467" width="270.0" height="99" rx="9" fill="#edf7f1" stroke="#7fad91" />
<text x="646.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">切回这首</text>
<text x="646.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">直接显示「试听中 · 正在试听上次重新对</text>
<text x="646.0" y="529.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">齐的结果」，提示「还没发布，所有人在用</text>
<text x="646.0" y="546.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">的仍是原来那份」</text>
<line x1="905.0" y1="516.5" x2="923.0" y2="516.5" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="926.0" y="467" width="270.0" height="99" rx="9" fill="#edf7f1" stroke="#7fad91" />
<text x="940.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#316247">决定</text>
<text x="940.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">发布 → 替换并关闭报错；放弃 → 删掉待</text>
<text x="940.0" y="529.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">发布，什么都没改</text>
<rect x="24" y="604" width="1192" height="146" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="633.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">④ 边界</text>
<rect x="44.0" y="648" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="58.0" y="672.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">原歌词已拿不到</text>
<text x="58.0" y="693.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">服务器只保存每次成功对齐时用的原歌词；更早的版本没有</text>
<text x="58.0" y="710.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">存，无法重跑，按钮不出现</text>
<rect x="436.0" y="648" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="450.0" y="672.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">版本已经换过</text>
<text x="450.0" y="693.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">报错之后这首歌已换了别的版本，出现「已换过版本，关闭</text>
<text x="450.0" y="710.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">报错」，不再让人对着旧版本处理</text>
<rect x="828.0" y="648" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="842.0" y="672.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">重跑失败</text>
<text x="842.0" y="693.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">只提示这一次失败，不会把这首歌标成「对齐失败」，也不</text>
<text x="842.0" y="710.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">影响大家在用的版本</text>
</g></svg>