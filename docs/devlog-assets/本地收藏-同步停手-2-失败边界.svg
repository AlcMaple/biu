<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478"><rect x="1" y="1" width="958" height="476" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="26" y="37" font-size="19" fill="#282529" font-weight="700">首次暂停写盘失败也停手（2/3 · 图稿待审）</text><text x="26" y="64" font-size="12.5" fill="#756f73" font-weight="400">关键原因：刷新会清掉内存，但出站前的待确认记录仍在本机。</text><text x="26" y="103" font-size="14" fill="#282529" font-weight="700">为什么不能只在内存里按暂停？</text><g data-card="true"><rect x="26" y="121" width="200" height="140" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="40" y="148" font-size="12.5" fill="#36566d" font-weight="700">先保存待确认记录</text><text x="40" y="176" font-size="11" fill="#282529" font-weight="400">保存失败就不发送。</text><text x="40" y="199" font-size="11" fill="#282529" font-weight="400">记录和请求一一对应。</text></g><g data-card="true"><rect x="262" y="121" width="200" height="140" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="276" y="148" font-size="12.5" fill="#316247" font-weight="700">再发送实际请求</text><text x="276" y="176" font-size="11" fill="#282529" font-weight="400">正常完成后确认记录。</text><text x="276" y="199" font-size="11" fill="#282529" font-weight="400">收到限制则保存暂停。</text></g><g data-card="true"><rect x="498" y="121" width="200" height="140" rx="10" fill="#fdeef0" stroke="#d99aa5"/><text x="512" y="148" font-size="12.5" fill="#96434f" font-weight="700">首次暂停保存失败</text><text x="512" y="176" font-size="11" fill="#282529" font-weight="400">原待确认记录还在。</text><text x="512" y="199" font-size="11" fill="#282529" font-weight="400">原页面撤销存活登记。</text></g><g data-card="true"><rect x="734" y="121" width="200" height="140" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="748" y="148" font-size="12.5" fill="#36566d" font-weight="700">其他页面仍停手</text><text x="748" y="176" font-size="11" fill="#282529" font-weight="400">看到未完成记录，</text><text x="748" y="199" font-size="11" fill="#282529" font-weight="400">等待明确人工确认。</text></g><path d="M231 191H255m-6-5 6 5-6 5" stroke="#91adc1" stroke-width="2" fill="none"/><path d="M467 191H491m-6-5 6 5-6 5" stroke="#91adc1" stroke-width="2" fill="none"/><path d="M703 191H727m-6-5 6 5-6 5" stroke="#91adc1" stroke-width="2" fill="none"/><g data-card="true"><rect x="26" y="300" width="440" height="145" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="40" y="327" font-size="12.5" fill="#316247" font-weight="700">正常并发不被通知通道占住</text><text x="40" y="355" font-size="11" fill="#282529" font-weight="400">仍存活页面的请求不会挡住另一页面。</text><text x="40" y="378" font-size="11" fill="#282529" font-weight="400">本机页面锁只识别存活者，</text><text x="40" y="401" font-size="11" fill="#282529" font-weight="400">不持有跨网络请求的串行锁。</text></g><g data-card="true"><rect x="490" y="300" width="444" height="145" rx="10" fill="#f4f2f5" stroke="#c3bcc6"/><text x="504" y="327" font-size="12.5" fill="#4a4450" font-weight="700">验证范围和边界</text><text x="504" y="355" font-size="11" fill="#282529" font-weight="400">真实浏览器：存储、页面锁、刷新、恢复。</text><text x="504" y="378" font-size="11" fill="#282529" font-weight="400">本地HTTP：429、503与已列明风控信号。</text><text x="504" y="401" font-size="11" fill="#282529" font-weight="400">已接受的请求不撤回；跨设备不是本轮结论。</text></g></g></svg>