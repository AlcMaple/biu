<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="821" viewBox="0 0 1240 821" role="img">
<title>歌词审核流程优化（2/3）：那个严重问题，为什么放进「待发布」，哪里容易改错</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker></defs>
<rect x="1" y="1" width="1238" height="819" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
<text x="34.0" y="42.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#282529">歌词审核流程优化（2/3）：那个严重问题，为什么放进「待发布」，哪里容易改错</text>
<text x="34.0" y="66.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">结论：以前「重新对齐」和大家在用的版本存在同一个位置，所以「试听 → 决定发布」实际上什么都没拦住；现在两者分开存。</text>
<g transform="translate(0,0)">
<rect x="24" y="95" width="1192" height="146" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">① 严重问题是怎么发生的</text>
<rect x="44.0" y="139" width="368.0" height="82" rx="9" fill="#f4f2f5" stroke="#c3bcc6" />
<text x="58.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#4a4450">同一首歌、同一份歌词</text>
<text x="58.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">两次对齐落在同一个存放位置，这本身是对的：歌词一样就</text>
<text x="58.0" y="201.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4a4450">该复用</text>
<line x1="415.0" y1="180.0" x2="433.0" y2="180.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="436.0" y="139" width="368.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="450.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">管理员重新对齐</text>
<text x="450.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">新结果写进了同一个位置</text>
<line x1="807.0" y1="180.0" x2="825.0" y2="180.0" stroke="#8f8792" stroke-width="1.5" marker-end="url(#ah)" />
<rect x="828.0" y="139" width="368.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="842.0" y="163.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">所有人立刻用上</text>
<text x="842.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">没发布就上线；放弃也撤不回；报错详情里的证据被换掉</text>
<rect x="24" y="259" width="1192" height="129" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="288.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">② 切歌回来要重跑，是两个原因叠加</text>
<rect x="44.0" y="303" width="564.0" height="65" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="58.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">试听状态只在内存里</text>
<text x="58.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">切歌就清掉，回来什么都不记得</text>
<rect x="632.0" y="303" width="564.0" height="65" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="646.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">手动重对齐总是跳过已有结果</text>
<text x="646.0" y="348.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">所以回来再点只能整首重跑；问题不在存放位置的算法本身</text>
<rect x="24" y="406" width="1192" height="225" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="435.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">③ 为什么不那样做</text>
<rect x="44.0" y="450" width="368.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="58.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不把试听状态存在本机</text>
<text x="58.0" y="495.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">换台设备、换个管理员就没了；而且本机存的只是副本，发</text>
<text x="58.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">布时仍要以服务器为准</text>
<rect x="436.0" y="450" width="368.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="450.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不给重跑结果换个存放位置后直接上线</text>
<text x="450.0" y="495.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">照样跳过了「试听 → 决定」这一步，只是把覆盖推迟</text>
<rect x="828.0" y="450" width="368.0" height="82" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="842.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不把手动和自动的对齐请求合并</text>
<text x="842.0" y="495.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">合并后自动请求会拿到还没发布的结果，等于提前上线</text>
<rect x="44.0" y="546" width="564.0" height="65" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="58.0" y="570.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">手动重跑失败不记成「对齐失败」</text>
<text x="58.0" y="591.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">否则这首歌会被锁住，普通用户的自动对齐也不再尝试</text>
<rect x="632.0" y="546" width="564.0" height="65" rx="9" fill="#fdeef0" stroke="#d99aa5" />
<text x="646.0" y="570.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">审核页不显示「刷新报错」这类兜底文案</text>
<text x="646.0" y="591.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">拿不到原歌词、版本已换、重跑失败各有各的原因和出路，统一文案会让人反复点</text>
<rect x="24" y="649" width="1192" height="146" rx="10" fill="#ffffff" stroke="#c3bcc6" />
<text x="44.0" y="678.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">④ 改错红线</text>
<rect x="44.0" y="693" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="58.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">发布必须指明是哪一份结果</text>
<text x="58.0" y="738.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">按「这份歌词」去发布，避免发布时间点上把别的结果顶上</text>
<text x="58.0" y="755.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">去</text>
<rect x="436.0" y="693" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="450.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">客户端和服务器要一起上线</text>
<text x="450.0" y="738.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">新客户端发布时带的信息旧服务器不认，只升级一边会发布</text>
<text x="450.0" y="755.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">失败</text>
<rect x="828.0" y="693" width="368.0" height="82" rx="9" fill="#fff8e8" stroke="#d9bd85" />
<text x="842.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#7a6234">发布 / 批准上传都要关同首歌的报错</text>
<text x="842.0" y="738.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7a6234">漏关的话报错人会一直看到「处理中」</text>
</g></svg>