<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500"><rect x="1" y="1" width="1038" height="498" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="28" y="38" font-size="19" font-weight="700" fill="#282529">听歌排行云端统一（1/1）</text><text x="28" y="65" font-size="12.5" fill="#756f73">设计结果：桌面与网页读取同一账号的云端排行；离线记录先留本机，不重复累计。</text><text x="28" y="104" font-size="14" font-weight="700" fill="#282529">正常使用：一次播放只累计一次</text><rect x="28" y="120" width="280" height="112" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="42" y="145" font-size="12.5" font-weight="700" fill="#36566d">桌面 / 网页播放</text><text x="42" y="171" font-size="11" fill="#36566d">先把这次播放写入本机队列</text><text x="42" y="192" font-size="11" fill="#36566d">断网或退出后，待同步记录仍保留</text><rect x="380" y="120" width="280" height="112" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="394" y="145" font-size="12.5" font-weight="700" fill="#316247">同一账号的云端排行</text><text x="394" y="171" font-size="11" fill="#316247">按设备序号去重，再累加次数</text><text x="394" y="192" font-size="11" fill="#316247">响应丢失后重发，不会重复累计</text><rect x="732" y="120" width="280" height="112" rx="10" fill="#edf7f1" stroke="#7fad91"/><text x="746" y="145" font-size="12.5" font-weight="700" fill="#316247">另一端看到相同结果</text><text x="746" y="171" font-size="11" fill="#316247">共用已有变更通知，无新增轮询</text><text x="746" y="192" font-size="11" fill="#316247">周排行与总排行都以云端数据为准</text><path d="M318,176 H362 m-5,-5 l5,5 -5,5" fill="none" stroke="#91adc1" stroke-width="2"/><path d="M670,176 H714 m-5,-5 l5,5 -5,5" fill="none" stroke="#91adc1" stroke-width="2"/><text x="28" y="274" font-size="14" font-weight="700" fill="#282529">边界处理：让用户知道哪些数据已经同步</text><rect x="28" y="290" width="312" height="142" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="42" y="315" font-size="12.5" font-weight="700" fill="#7a6234">旧记录：登录自动归入</text><text x="42" y="341" font-size="11" fill="#7a6234">登录后第一次同步自动合并</text><text x="42" y="362" font-size="11" fill="#7a6234">同一批只导入一次</text><text x="42" y="383" font-size="11" fill="#7a6234">原始旧记录保留，不重复导入</text><rect x="364" y="290" width="312" height="142" rx="10" fill="#fff8e8" stroke="#d9bd85"/><text x="378" y="315" font-size="12.5" font-weight="700" fill="#7a6234">离线 / 限流 / 服务未更新</text><text x="378" y="341" font-size="11" fill="#7a6234">显示上次云端结果和待同步次数</text><text x="378" y="362" font-size="11" fill="#7a6234">失败后停止自动请求，显示具体原因</text><text x="378" y="383" font-size="11" fill="#7a6234">重开排行页或重新登录后再尝试</text><rect x="700" y="290" width="312" height="142" rx="10" fill="#eef4f8" stroke="#91adc1"/><text x="714" y="315" font-size="12.5" font-weight="700" fill="#36566d">账号切换 / 未登录</text><text x="714" y="341" font-size="11" fill="#36566d">切换账号立即清空上一账号画面</text><text x="714" y="362" font-size="11" fill="#36566d">每个账号的待同步队列独立保留</text><text x="714" y="383" font-size="11" fill="#36566d">未登录只记本机，不上传云端</text><text x="28" y="469" font-size="12.5" fill="#756f73">常见情况：登录同一账号后正常听歌即可；无需任何手动同步。</text></g></svg>