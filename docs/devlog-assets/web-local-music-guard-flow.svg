<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
  <title id="title">Web 本地音乐双重闸门</title>
  <desc id="desc">Web 通过统一菜单过滤和路由重定向移除本地文件夹音乐，Electron 仍保留完整扫描链路，本地歌单不受影响。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 650; }
    .small { font-size: 13px; fill: #5f6368; }
    .box { fill: #fff; stroke: #c7c9d1; stroke-width: 1.5; rx: 12; }
    .source { fill: #f1edff; stroke: #7c5ce7; }
    .web { fill: #fff4dc; stroke: #c58b25; }
    .electron { fill: #e8f4ff; stroke: #4f87c7; }
    .safe { fill: #eaf8ee; stroke: #4f9d69; }
    .arrow { fill: none; stroke: #747780; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#747780" />
    </marker>
  </defs>
  <text x="40" y="42" class="title">本地文件夹音乐：Web 双重闸门，应用链路保留</text>
  <rect x="350" y="68" width="280" height="62" class="box source" />
  <text x="490" y="95" text-anchor="middle" class="label">运行时平台：isWeb</text>
  <text x="490" y="116" text-anchor="middle" class="small">同一份菜单和路由按能力分流</text>
  <path d="M 420 130 C 350 158 270 160 210 184" class="arrow" />
  <path d="M 560 130 C 630 158 710 160 770 184" class="arrow" />
  <rect x="50" y="186" width="320" height="84" class="box web" />
  <text x="210" y="216" text-anchor="middle" class="label">Web：菜单闸门</text>
  <text x="210" y="241" text-anchor="middle" class="small">侧栏 + 菜单设置统一过滤 /local-music</text>
  <text x="210" y="260" text-anchor="middle" class="small">不写入用户 hiddenMenuKeys</text>
  <rect x="610" y="186" width="320" height="84" class="box electron" />
  <text x="770" y="216" text-anchor="middle" class="label">Electron：功能保留</text>
  <text x="770" y="241" text-anchor="middle" class="small">LocalMusicPage → preload → IPC</text>
  <text x="770" y="260" text-anchor="middle" class="small">扫描、播放、删除本机音频</text>
  <path d="M 210 270 L 210 307" class="arrow" />
  <rect x="50" y="309" width="320" height="62" class="box web" />
  <text x="210" y="335" text-anchor="middle" class="label">Web：路由闸门</text>
  <text x="210" y="357" text-anchor="middle" class="small">直达 #/local-music → Navigate("/")</text>
  <rect x="610" y="309" width="320" height="62" class="box safe" />
  <text x="770" y="335" text-anchor="middle" class="label">本地歌单不受影响</text>
  <text x="770" y="357" text-anchor="middle" class="small">local-collection/:id 与收藏数据继续共用</text>
</svg>
