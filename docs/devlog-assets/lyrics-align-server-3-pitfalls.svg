<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="505" viewBox="0 0 1240 505" role="img" aria-labelledby="title desc">
  <title id="title">歌词时间轴自动对齐服务（3/3）：为什么不那样做</title>
  <desc id="desc">6 条反直觉的设计决定：不能怎么做、为什么，以及现在的做法。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8792" /></marker>
  </defs>
  <rect x="1" y="1" width="1238" height="503" rx="14" fill="#fbfafb" stroke="#e2dcdf" />
  <text x="34.0" y="42.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#282529">歌词时间轴自动对齐服务（3/3）：为什么不那样做</text>
  <text x="34.0" y="66.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#756f73">这 6 条都是踩过坑才定下来的，也是接手时最容易「顺手改回去」的地方。红字是不能做的和原因，绿字是现在的做法；细节见调研文档 5.2.11 ~ 5.2.15。</text>
  <rect x="24.0" y="94.0" width="1192.0" height="387.0" rx="10" fill="#f4f2f5" stroke="#c3bcc6" />
  <text x="44.0" y="123.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#282529">① 接手时最容易改错的地方</text>
  <rect x="44.0" y="140.0" width="564.0" height="102.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="60.0" y="171.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不要把失败行回退成「原歌词时间 + 均匀填充」</text>
  <text x="60.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">人耳试听：凡是标「推测」的行都跟不上，回退反而把对的行改错（唯一这首回退的 14 </text>
  <text x="60.0" y="211.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">行全是改错）。</text>
  <text x="60.0" y="228.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：失败行只在原歌词时间附近的窗口里重新做一次强制对齐，逐字时间仍来自音频。</text>
  <rect x="632.0" y="140.0" width="564.0" height="102.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="648.0" y="171.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不要只用一种方式把音频切成 15 秒一块</text>
  <text x="648.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">块边缘的模型只看到单侧上下文。跳楼机「又急速落地」正好压在 90 秒边界上，整句被</text>
  <text x="648.0" y="211.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">挤到下一行，用户看到高亮卡住、再闪过去。</text>
  <text x="648.0" y="228.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：按 0 秒、7.5 秒两种起点各切一遍，取平均。计算量翻倍，每首约多 15 秒。</text>
  <rect x="44.0" y="258.0" width="564.0" height="102.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="60.0" y="289.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不要允许歌词落在人声静音处</text>
  <text x="60.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">晴天 Hi-Res 前奏 29 秒人声为 0，首行仍被放在 2.8 秒，开头整段错位。</text>
  <text x="60.0" y="329.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：人声几乎没有能量的帧，不许放字。</text>
  <rect x="632.0" y="258.0" width="564.0" height="102.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="648.0" y="289.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">配错判据不要只看一个数</text>
  <text x="648.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">只看置信度：对得上的最低 0.277，配错的最高 0.215，只差 0.06。只看重对齐行数：</text>
  <text x="648.0" y="329.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">对得上的也会有 2 行。</text>
  <text x="648.0" y="346.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：两条同时满足才判配错。15 首对得上、4 组配错，两边各 100% 判对。</text>
  <rect x="44.0" y="376.0" width="564.0" height="85.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="60.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不要并进云同步服务</text>
  <text x="60.0" y="430.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">一首歌吃满 CPU 约 2 分钟，Python 峰值 2.5 GB；对齐崩溃或重启不能连累同步。</text>
  <text x="60.0" y="447.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：独立服务，只和同步服务共用登录凭证的签名密钥。</text>
  <rect x="632.0" y="376.0" width="564.0" height="85.0" rx="9" fill="#fdeef0" stroke="#d99aa5" />
  <text x="648.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#96434f">不要让客户端传音频地址</text>
  <text x="648.0" y="430.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#96434f">服务器替任意地址下载，等于给别人一个可滥用的下载代理，签名地址也会外泄。</text>
  <text x="648.0" y="447.0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#316247">现在：只收 BV 号 + 分 P，服务端核对分 P 归属后，自己去 B 站取。</text>
</svg>
