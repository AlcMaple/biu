<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Biu · 响应式实现原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-logo" viewBox="0 0 24 24">
        <path
          d="M7.17157 2.75737 10.414 5.99948H13.585L16.8284 2.75737c.3906-.39052 1.0237-.39052 1.4142 0 .3906.39053.3906 1.02369 0 1.41421L16.414 5.99948 18.5 6c1.933 0 3.5 1.567 3.5 3.5v8c0 1.933-1.567 3.5-3.5 3.5h-13C3.567 21 2 19.433 2 17.5v-8C2 7.567 3.567 6 5.5 6l2.085-.00052L5.75736 4.17158c-.39052-.39052-.39052-1.02368 0-1.41421.39052-.39052 1.02369-.39052 1.41421 0Z"
          fill="currentColor"
          stroke="none"
        />
        <path
          d="m15.1767 12.643c.6462.3886.6462 1.3254-.0001 1.714l-4.2608 2.5619c-.6665.4008-1.5153-.0792-1.5153-.857l.0001-5.124c0-.7777.8488-1.2577 1.5153-.857l4.2608 2.562Z"
          fill="white"
          stroke="none"
        />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.3" />
        <path d="m16 16 4.7 4.7" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-disc" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <circle cx="12" cy="12" r="2.3" />
        <path d="M4.9 4.9 2.7 2.7M19.1 4.9l2.2-2.2" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M20.7 8.9c0 4.9-8.7 10.1-8.7 10.1S3.3 13.8 3.3 8.9c0-2.4 1.8-4.3 4.1-4.3 1.9 0 3.5 1.2 4.6 2.8 1.1-1.6 2.7-2.8 4.6-2.8 2.3 0 4.1 1.9 4.1 4.3Z"
        />
      </symbol>
      <symbol id="i-heart-pulse" viewBox="0 0 24 24">
        <path d="M3 12h3l1.7-4 3.2 9 2.2-6 1.2 2H21" />
        <path
          d="M19.5 5.7A4.7 4.7 0 0 0 12 7.2a4.7 4.7 0 0 0-7.5-1.5c-2 2.1-1.4 5.5.5 7.5L12 20l7-6.8c1.9-2 2.5-5.4.5-7.5Z"
        />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4M5 17v3h14v-3" /></symbol>
      <symbol id="i-music" viewBox="0 0 24 24">
        <path d="M9 18V5l10-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="16" cy="16" r="3" />
      </symbol>
      <symbol id="i-play-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" />
        <path d="m10 8 6 4-6 4Z" fill="white" stroke="none" />
      </symbol>
      <symbol id="i-pause-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" />
        <path d="M10 8v8M14 8v8" stroke="white" stroke-width="2" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="M6 6v12M18 6l-9 6 9 6z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M18 6v12M6 6l9 6-9 6z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M8 6h12M8 12h12M8 18h12" />
        <circle cx="4" cy="6" r=".8" fill="currentColor" />
        <circle cx="4" cy="12" r=".8" fill="currentColor" />
        <circle cx="4" cy="18" r=".8" fill="currentColor" />
      </symbol>
      <symbol id="i-volume" viewBox="0 0 24 24">
        <path d="M4 10v4h4l5 4V6L8 10z" />
        <path d="M16 9.5a4 4 0 0 1 0 5M18.7 7a7.5 7.5 0 0 1 0 10" />
      </symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24">
        <path d="M18 7h2v5M6 17H4v-5M4.5 12A7.5 7.5 0 0 1 17 6.5L20 7M19.5 12A7.5 7.5 0 0 1 7 17.5L4 17" />
      </symbol>
      <symbol id="i-rate" viewBox="0 0 24 24">
        <path d="M4 7h10M4 12h16M4 17h10" />
        <path d="m17 5 3 2-3 2M17 15l3 2-3 2" />
      </symbol>
      <symbol id="i-caption" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M7 14c1.1 1.3 3.2 1.3 4.3 0M13 14c1.1 1.3 3.2 1.3 4.3 0" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.4 2.4-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.4-2.4.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4.3v-3.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L8 5.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.4 2.4-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"
        />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9" />
        <path d="M11 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
      </symbol>
    </svg>

    <div id="app" class="app-shell" data-component="Layout">
      <aside class="side-nav" aria-label="主导航" data-component="SideNav">
        <div class="brand-row" data-component="Logo">
          <svg class="brand-logo"><use href="#i-logo" /></svg><span class="brand-name">Biu</span>
        </div>
        <div class="side-scroll"><nav class="menu-group" id="desktop-menu" aria-label="音乐功能"></nav></div>
      </aside>

      <section class="main-stage">
        <header class="navbar" data-component="Navbar">
          <div class="navbar-left">
            <button
              class="icon-button mobile-menu-button"
              type="button"
              aria-label="打开菜单"
              data-action="open-mobile-menu"
            >
              <svg class="icon"><use href="#i-menu" /></svg>
            </button>
            <button class="icon-button desktop-navigation" type="button" aria-label="返回" disabled>
              <svg class="icon"><use href="#i-back" /></svg>
            </button>
            <div class="search-shell" id="search-shell" data-component="Search">
              <div class="search-input-wrap">
                <svg class="icon"><use href="#i-search" /></svg
                ><input
                  id="search-input"
                  class="search-input"
                  type="search"
                  autocomplete="off"
                  placeholder="搜索"
                  aria-label="搜索"
                /><button class="clear-search" type="button" aria-label="清除搜索" data-action="clear-search">
                  <svg class="icon"><use href="#i-close" /></svg>
                </button>
              </div>
              <div class="search-popover" id="search-popover" aria-label="搜索建议"></div>
            </div>
          </div>
          <div class="navbar-right">
            <button
              class="icon-button recognize-button"
              type="button"
              aria-label="听歌识曲"
              data-action="toast"
              data-message="原型中：开始听歌识曲"
            >
              <svg class="icon"><use href="#i-music" /></svg></button
            ><button
              class="avatar"
              type="button"
              aria-label="用户菜单"
              data-action="toast"
              data-message="原型中：打开用户菜单"
            >
              <span class="avatar-face"></span>
            </button>
          </div>
        </header>
        <main class="content-scroll" id="page-scroll" tabindex="-1">
          <div class="page-inner" id="page-content"></div>
        </main>
      </section>

      <footer class="playbar" data-component="PlayBar">
        <button class="desktop-player-left" type="button" data-action="open-full-player" aria-label="打开全屏播放器">
          <span class="player-cover" id="desktop-player-cover"></span
          ><span class="player-copy"
            ><span class="player-title" id="desktop-player-title"></span
            ><span class="player-author" id="desktop-player-author"></span
          ></span>
        </button>
        <div class="desktop-player-center">
          <div class="transport">
            <button class="icon-button" type="button" aria-label="上一首" data-action="previous">
              <svg class="icon fill-icon"><use href="#i-prev" /></svg></button
            ><button
              class="play-button"
              type="button"
              aria-label="播放"
              data-action="toggle-play"
              data-play-toggle
            ></button
            ><button class="icon-button" type="button" aria-label="下一首" data-action="next">
              <svg class="icon fill-icon"><use href="#i-next" /></svg>
            </button>
          </div>
          <div class="progress-line">
            <span id="desktop-current-time">01:18</span
            ><span class="progress-track"
              ><span class="progress-value" style="--progress: 32%"></span
              ><span class="progress-dot" style="--progress: 32%"></span></span
            ><span id="desktop-total-time">03:46</span>
          </div>
        </div>
        <div class="desktop-player-right">
          <button
            class="icon-button hide-tablet"
            type="button"
            aria-label="顺序播放"
            data-action="toast"
            data-message="原型中：顺序播放"
          >
            <svg class="icon"><use href="#i-repeat" /></svg></button
          ><button
            class="icon-button hide-tablet"
            type="button"
            aria-label="打开下载选项"
            data-action="toast"
            data-message="原型中：打开下载选项"
          >
            <svg class="icon"><use href="#i-download" /></svg></button
          ><button class="icon-button" type="button" aria-label="播放列表" data-action="open-queue">
            <svg class="icon"><use href="#i-list" /></svg></button
          ><button
            class="icon-button hide-tablet"
            type="button"
            aria-label="调节音量，当前 50%"
            data-action="toast"
            data-message="原型中：当前音量 50%"
          >
            <svg class="icon"><use href="#i-volume" /></svg></button
          ><button
            class="icon-button rate-button hide-tablet"
            type="button"
            aria-label="播放速率，当前 1 倍"
            data-action="toast"
            data-message="原型中：播放速度为 1 倍"
          >
            1x
          </button>
        </div>
        <div class="mobile-player" data-component="MobilePlayBar">
          <div class="mobile-progress">
            <span class="progress-track"><span class="progress-value" style="--progress: 32%"></span></span>
          </div>
          <div class="mobile-player-row">
            <button
              class="mobile-track-target"
              type="button"
              data-action="open-full-player"
              aria-label="打开全屏播放器"
            >
              <span class="player-cover" id="mobile-player-cover"></span
              ><span class="mobile-player-copy"
                ><span class="player-title" id="mobile-player-title"></span
                ><span class="player-author" id="mobile-player-author"></span
              ></span>
            </button>
            <div class="mobile-controls">
              <button class="icon-button" type="button" aria-label="上一首" data-action="previous">
                <svg class="icon fill-icon"><use href="#i-prev" /></svg></button
              ><button
                class="play-button"
                type="button"
                aria-label="播放"
                data-action="toggle-play"
                data-play-toggle
              ></button
              ><button class="icon-button" type="button" aria-label="下一首" data-action="next">
                <svg class="icon fill-icon"><use href="#i-next" /></svg></button
              ><button
                class="icon-button"
                type="button"
                aria-label="随机播放"
                data-action="toast"
                data-message="原型中：切换播放顺序"
              >
                <svg class="icon"><use href="#i-repeat" /></svg></button
              ><button class="icon-button" type="button" aria-label="播放列表" data-action="open-queue">
                <svg class="icon"><use href="#i-list" /></svg>
              </button>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <button
      id="drawer-backdrop"
      class="drawer-backdrop"
      type="button"
      aria-label="关闭抽屉"
      data-action="close-drawers"
    ></button>
    <aside
      id="mobile-side-drawer"
      class="mobile-side-drawer"
      aria-label="移动端菜单"
      aria-hidden="true"
      data-component="SideNav"
    >
      <div class="brand-row" data-component="Logo">
        <svg class="brand-logo"><use href="#i-logo" /></svg><span class="brand-name">Biu</span>
      </div>
      <div class="side-scroll"><nav class="menu-group" id="mobile-menu" aria-label="移动端音乐功能"></nav></div>
    </aside>
    <aside
      id="queue-drawer"
      class="queue-drawer"
      aria-label="播放列表"
      aria-hidden="true"
      data-component="PlayListDrawer"
    >
      <div class="drawer-head">
        <span>播放列表<small id="queue-count"></small></span
        ><button class="icon-button" type="button" aria-label="关闭播放列表" data-action="close-drawers">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="queue-list" class="queue-list"></div>
    </aside>

    <section
      id="full-player"
      class="full-player"
      aria-label="全屏播放器"
      aria-hidden="true"
      data-component="FullScreenPlayer"
    >
      <header class="full-header">
        <button class="icon-button" type="button" aria-label="关闭全屏播放器" data-action="close-full-player">
          <svg class="icon"><use href="#i-chevron-down" /></svg>
        </button>
        <div class="full-heading">
          <h2 id="full-player-title"></h2>
          <p id="full-player-author"></p>
        </div>
        <button class="icon-button" type="button" aria-label="播放器设置" data-action="toggle-full-settings">
          <svg class="icon"><use href="#i-settings" /></svg>
        </button>
        <div id="full-settings" class="full-settings-popover">
          <div class="setting-line">
            <span>显示歌词</span
            ><button
              class="switch is-on"
              type="button"
              aria-label="切换显示歌词"
              data-action="toast"
              data-message="原型中：歌词显示已开启"
            ></button>
          </div>
          <div class="setting-line">
            <span>显示封面</span
            ><button
              class="switch is-on"
              type="button"
              aria-label="切换显示封面"
              data-action="toast"
              data-message="原型中：封面显示已开启"
            ></button>
          </div>
          <div class="setting-line">
            <span>模糊背景</span
            ><button
              class="switch is-on"
              type="button"
              aria-label="切换模糊背景"
              data-action="toast"
              data-message="原型中：模糊背景已开启"
            ></button>
          </div>
        </div>
      </header>
      <div class="full-main">
        <div class="full-art-wrap"><div id="full-player-cover" class="full-cover"></div></div>
        <div class="lyrics-panel" aria-label="模拟歌词">
          <p class="lyric-line">夜色正慢慢落在城市边缘</p>
          <p class="lyric-line">那些没说出口的话，仍在耳边</p>
          <p class="lyric-line is-current">等风来，也等你靠近</p>
          <p class="lyric-line">星光穿过云层，照亮回家的路</p>
          <p class="lyric-line">明天会比今天更温柔一点</p>
        </div>
      </div>
      <div class="full-controls">
        <div class="progress-line">
          <span>01:18</span
          ><span class="progress-track"
            ><span class="progress-value" style="--progress: 32%"></span
            ><span class="progress-dot" style="--progress: 32%"></span></span
          ><span id="full-total-time">03:46</span>
        </div>
        <div class="full-actions">
          <button
            class="icon-button"
            type="button"
            aria-label="顺序播放"
            data-action="toast"
            data-message="原型中：顺序播放"
          >
            <svg class="icon"><use href="#i-repeat" /></svg></button
          ><button class="icon-button" type="button" aria-label="上一首" data-action="previous">
            <svg class="icon fill-icon"><use href="#i-prev" /></svg></button
          ><button
            class="play-button"
            type="button"
            aria-label="播放"
            data-action="toggle-play"
            data-play-toggle
          ></button
          ><button class="icon-button" type="button" aria-label="下一首" data-action="next">
            <svg class="icon fill-icon"><use href="#i-next" /></svg></button
          ><button class="icon-button" type="button" aria-label="播放列表" data-action="open-queue">
            <svg class="icon"><use href="#i-list" /></svg>
          </button>
        </div>
      </div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
